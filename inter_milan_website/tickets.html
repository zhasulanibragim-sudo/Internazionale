<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inter Milan | Билеты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-inter-black">
        <div class="container">
            <a class="navbar-brand text-inter-blue fw-bold fs-3" href="index.html">INTER</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="history.html">История</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tickets.html">Билеты</a></li>
                    <li class="nav-item"><a class="nav-link" href="store.html">Магазин</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="text-center mb-4">Бронирование билетов</h2>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form class="p-4 border rounded shadow-sm">
                    <div class="mb-3">
                        <label for="matchSelect" class="form-label">Выберите матч</label>
                        <select class="form-select" id="matchSelect">
                            <option>Интер - Ювентус (Серия А)</option>
                            <option>Интер - Милан (Дерби делла Мадоннина)</option>
                            <option>Интер - Рома (Серия А)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="nameInput" class="form-label">Имя и Фамилия</label>
                        <input type="text" class="form-control" id="nameInput" placeholder="Введите ваши данные">
                    </div>
                    <div class="mb-3">
                        <label for="emailInput" class="form-label">Email</label>
                        <input type="email" class="form-control" id="emailInput" placeholder="name@example.com">
                    </div>
                    <div class="mb-3">
                        <label for="ticketCount" class="form-label">Количество билетов</label>
                        <input type="number" class="form-control" id="ticketCount" min="1" max="4" value="1">
                    </div>
                    <button type="submit" class="btn btn-inter w-100">Забронировать</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
